name: Full pinned registration
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
concurrency:
  group: full-registration
  cancel-in-progress: false
jobs:
  registration:
    # Manual/default-branch schedule only; never execute PR code with sibling credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Keep native binaries + workspace tests + two kind runs within hosted disk limits.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: bootleg-cli
          persist-credentials: false
      - name: Read exact sibling revisions
        id: pins
        working-directory: bootleg-cli
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          pins = json.loads(pathlib.Path('scripts/acceptance-revisions.json').read_text())
          assert set(pins) == {'bootleg-core', 'bootleg-web', 'bootleg-smuggler'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, sha in pins.items():
                  assert re.fullmatch('[0-9a-f]{40}', sha)
                  print(f'{name}={sha}', file=output)
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bootlegcode/bootleg-core
          ref: ${{ steps.pins.outputs.bootleg-core }}
          token: ${{ secrets.BOOTLEG_REPO_READ_TOKEN }}
          path: bootleg-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bootlegcode/bootleg-web
          ref: ${{ steps.pins.outputs.bootleg-web }}
          token: ${{ secrets.BOOTLEG_REPO_READ_TOKEN }}
          path: bootleg-web
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bootlegcode/bootleg-smuggler
          ref: ${{ steps.pins.outputs.bootleg-smuggler }}
          token: ${{ secrets.BOOTLEG_REPO_READ_TOKEN }}
          path: bootleg-smuggler
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - run: cargo install --locked cargo-nextest --version 0.9.114
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.1
      - name: Provision Linux tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fzf
          curl --fail --location --silent --show-error -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl --fail --location --silent --show-error -o kind.sha256 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          echo "$(awk '{print $1}' kind.sha256)  kind" | sha256sum --check
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version
          kubectl version --client
          docker info >/dev/null
      - working-directory: bootleg-web
        run: npm ci && npx --no-install playwright install --with-deps chromium
      - name: Build actual executables from clean pinned sources
        run: |
          for repo in bootleg-cli bootleg-web bootleg-smuggler; do
            (cd "$repo" && cargo build --locked)
          done
          # Compile supplemental store-test tooling before the bounded scenario run.
          (cd bootleg-web && cargo build --locked -p bootleg-infrastructure --example test_database)
          (cd bootleg-web && cargo nextest list --locked --workspace --all-targets > /dev/null)
      - name: Inject failure with stores, browser, agents and kind provisioned; verify cleanup
        working-directory: bootleg-cli
        run: python3 scripts/ci-registration.py --expect-failure-after-kind
      - name: Full executable/browser/kind evidence and cleanup gate
        working-directory: bootleg-cli
        run: python3 scripts/ci-registration.py
      - name: Upload only normalized registration reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registration-reports
          path: |
            bootleg-cli/ci-report.json
            bootleg-cli/ci-cleanup-report.json
          if-no-files-found: warn
          retention-days: 14
