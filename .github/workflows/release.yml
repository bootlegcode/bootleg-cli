name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.asset }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: bootleg-linux-x86_64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: bootleg-linux-x86_64-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: bootleg-macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: bootleg-macos-aarch64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: bootleg-windows-x86_64.exe
    defaults:
      run:
        shell: bash
        working-directory: bootleg-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bootleg-cli
          persist-credentials: false
      - id: pins
        run: echo "core=$(jq -er '."bootleg-core"' scripts/acceptance-revisions.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bootlegcode/bootleg-core
          ref: ${{ steps.pins.outputs.core }}
          path: bootleg-core
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --target '${{ matrix.target }}'
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Cache crates.io downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache/index.crates.io-*
            ~/.cargo/registry/index/index.crates.io-*
          key: cargo-crates-io-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.target }}-${{ hashFiles('bootleg-cli/Cargo.lock') }}
          restore-keys: |
            cargo-crates-io-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ matrix.target }}-
            cargo-crates-io-v1-${{ runner.os }}-${{ runner.arch }}-cli-
      - name: Build and stage the CLI
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          cargo +1.99.1 build --locked --release --bin bootleg --target "$TARGET"
          binary=bootleg
          if [[ "$RUNNER_OS" == Windows ]]; then binary=bootleg.exe; fi
          mkdir -p dist
          cp "target/$TARGET/release/$binary" "dist/$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: bootleg-cli/dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bootleg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums and publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          binaries=(bootleg-*)
          for binary in "${binaries[@]}"; do
            sha256sum "$binary" > "$binary.sha256"
          done

          options=(--verify-tag --generate-notes)
          # Ignore build metadata when detecting a SemVer prerelease.
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then options+=(--prerelease); fi
          release_url=$(gh release create "$RELEASE_TAG" "${options[@]}" -- bootleg-*)
          {
            printf '## [Release %s](%s)\n\n' "$RELEASE_TAG" "$release_url"
            printf 'Each binary has a matching `.sha256` checksum.\n\n'
            printf -- '- `%s`\n' "${binaries[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
