name: CLI checks
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      # Ephemeral runners don't reuse incremental state; omit debug info to reduce linking work.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        working-directory: bootleg-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bootleg-cli
          persist-credentials: false
      - id: pins
        run: echo "core=$(jq -er '."bootleg-core"' scripts/acceptance-revisions.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bootlegcode/bootleg-core
          ref: ${{ steps.pins.outputs.core }}
          path: bootleg-core
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy && rustup default 1.99.1
      - name: Verify release tag matches Cargo package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "bootleg-cli") | .version')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Expected tag v$version for this commit; got $RELEASE_TAG" >&2
            exit 1
          fi
      - run: cargo fmt --check
      - name: Cache crates.io downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache/index.crates.io-*
            ~/.cargo/registry/index/index.crates.io-*
          key: cargo-crates-io-v1-${{ runner.os }}-${{ runner.arch }}-cli-${{ hashFiles('bootleg-cli/Cargo.lock') }}
          restore-keys: cargo-crates-io-v1-${{ runner.os }}-${{ runner.arch }}-cli-
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: python3 scripts/test-ci-registration.py
      - run: python3 scripts/test-acceptance-pty.py
