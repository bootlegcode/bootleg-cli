[package]
name = "bootleg-cli"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[[bin]]
name = "bootleg"
path = "src/main.rs"

[dependencies]
bootleg-core = { path = "../bootleg-core" }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
comfy-table = "7"
owo-colors = "4.4.0"
terminal_size = "0.4.4"
textwrap = "0.16.4"
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
